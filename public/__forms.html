<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CyberRockola Music Forms Skeleton</title>
</head>
<body>
  <!-- This file is only for Netlify's build-time form detection. It will not be shown to users. -->
  <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="newsletter" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="interest" />
    <input type="text" name="bot-field" />
  </form>
</body>
</html>
